name: Security Workflow

on:
  workflow_call:
    inputs:
      sonar_host_url:
        description: "SonarQube host URL"
        required: false
        type: string
        default: "http://sonar.afya.tools:9000/"
      sonar_exclusions:
        description: "Additional Sonar exclusions"
        required: false
        type: string
        default: ""
      fail_on_quality_gate:
        description: "Block directly on the raw SonarQube quality gate at the scan step (the new-code gate below is the main decision)"
        required: false
        type: boolean
        default: false
      gate_block_qualities:
        description: "Software qualities with zero tolerance in new code (comma-separated)"
        required: false
        type: string
        default: "SECURITY,RELIABILITY"
      gate_block_severities:
        description: "Severities that block for gate_block_qualities (comma-separated)"
        required: false
        type: string
        default: "BLOCKER,HIGH"
      gate_max_maintainability:
        description: "Max new MAINTAINABILITY issues allowed before blocking (-1 = unlimited)"
        required: false
        type: number
        default: 10
      hotfix_label:
        description: "PR label that triggers the hotfix flow"
        required: false
        type: string
        default: "hotfix"
      bypass_branches_prefix:
        description: "Comma-separated branch prefixes eligible for the Sonar bypass (empty to disable)"
        required: false
        type: string
        default: "hotfix/,bugfix/,fix/"
      allow_hotfix_bypass:
        description: "Allow a validated hotfix (label or branch prefix) to skip the SonarQube scan"
        required: false
        type: boolean
        default: false
      jira_hotfix_issue_type:
        description: "Comma-separated Jira issuetype.name values that allow bypassing Sonar (case-insensitive)"
        required: false
        type: string
        default: "Hotfix,Bugfix,Fix"
      enable_jira_validation:
        description: "Validate the linked Jira issue on pull requests"
        required: false
        type: boolean
        default: true
    secrets:
      SONAR_FOUNDATION_TOKEN:
        required: true
      JIRA_BASE_URL:
        required: false
      JIRA_USER_EMAIL:
        required: false
      JIRA_API_TOKEN:
        required: false

  workflow_dispatch:
    inputs:
      sonar_host_url:
        description: "SonarQube host URL"
        required: false
        type: string
        default: "http://sonar.afya.tools:9000/"
      sonar_exclusions:
        description: "Additional Sonar exclusions"
        required: false
        type: string
        default: ""
      fail_on_quality_gate:
        description: "Block directly on the raw SonarQube quality gate at the scan step (the new-code gate below is the main decision)"
        required: false
        type: boolean
        default: false
      gate_block_qualities:
        description: "Software qualities with zero tolerance in new code (comma-separated)"
        required: false
        type: string
        default: "SECURITY,RELIABILITY"
      gate_block_severities:
        description: "Severities that block for gate_block_qualities (comma-separated)"
        required: false
        type: string
        default: "BLOCKER,HIGH"
      gate_max_maintainability:
        description: "Max new MAINTAINABILITY issues allowed before blocking (-1 = unlimited)"
        required: false
        type: number
        default: 10
      hotfix_label:
        description: "PR label that triggers the hotfix flow"
        required: false
        type: string
        default: "hotfix"
      bypass_branches_prefix:
        description: "Comma-separated branch prefixes eligible for the Sonar bypass (empty to disable)"
        required: false
        type: string
        default: "hotfix/,bugfix/,fix/"
      allow_hotfix_bypass:
        description: "Allow a validated hotfix (label or branch prefix) to skip the SonarQube scan"
        required: false
        type: boolean
        default: false
      jira_hotfix_issue_type:
        description: "Comma-separated Jira issuetype.name values that allow bypassing Sonar (case-insensitive)"
        required: false
        type: string
        default: "Hotfix,Bugfix,Fix"
      enable_jira_validation:
        description: "Validate the linked Jira issue on pull requests"
        required: false
        type: boolean
        default: true

jobs:
  static-application-security-testing:
    runs-on: runner-security-${{ github.repository_owner }}

    permissions:
      contents: read
      checks: write
      pull-requests: write

    env:
      SONAR_HOST_URL: ${{ inputs.sonar_host_url }}
      APPLICATION_NAME: ${{ github.event.repository.name }}
      COMPANY: ${{ github.repository_owner }}
      GIT_DEPTH: 0

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate Jira issue
        id: jira
        if: github.event_name == 'pull_request' && inputs.enable_jira_validation
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_USER_EMAIL: ${{ secrets.JIRA_USER_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          HOTFIX_LABEL: ${{ inputs.hotfix_label }}
          BYPASS_BRANCHES_PREFIX: ${{ inputs.bypass_branches_prefix }}
          ALLOW_HOTFIX_BYPASS: ${{ inputs.allow_hotfix_bypass }}
          JIRA_HOTFIX_ISSUE_TYPE: ${{ inputs.jira_hotfix_issue_type }}
          HEAD_REF: ${{ github.head_ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          HAS_HOTFIX_LABEL: ${{ contains(github.event.pull_request.labels.*.name, inputs.hotfix_label) }}
        shell: bash
        run: |
          set -euo pipefail

          ISSUE_KEY=$(printf '%s %s' "$HEAD_REF" "$PR_TITLE" \
            | grep -oiE '[A-Z][A-Z0-9]+-[0-9]+' | head -n 1 \
            | tr '[:lower:]' '[:upper:]' || true)

          if [ -z "$ISSUE_KEY" ]; then
            echo "::error::No Jira issue key found in branch '$HEAD_REF' or PR title."
            exit 1
          fi
          echo "Jira issue key: $ISSUE_KEY"

          HTTP=$(curl -sS -o response.json -w '%{http_code}' \
            --user "$JIRA_USER_EMAIL:$JIRA_API_TOKEN" \
            -H "Accept: application/json" \
            "$JIRA_BASE_URL/rest/api/2/issue/$ISSUE_KEY?fields=issuetype,status")

          if [ "$HTTP" != "200" ]; then
            echo "::error::Jira issue '$ISSUE_KEY' not found (HTTP $HTTP)."
            cat response.json || true
            exit 1
          fi

          echo "Jira API response for '$ISSUE_KEY':"
          jq '.fields | {issuetype: .issuetype.name, status: .status.name}' response.json || cat response.json

          ISSUE_TYPE=$(jq -r '.fields.issuetype.name // empty' response.json)
          if [ -z "$ISSUE_TYPE" ]; then
            echo "::error::Could not determine the Jira issue type for '$ISSUE_KEY'."
            cat response.json || true
            exit 1
          fi
          echo "Issue '$ISSUE_KEY' exists. Type: '$ISSUE_TYPE'."

          IS_HOTFIX="false"
          if [ "$ALLOW_HOTFIX_BYPASS" = "true" ]; then
            if [ "$HAS_HOTFIX_LABEL" = "true" ]; then
              IS_HOTFIX="true"
              echo "PR has the '$HOTFIX_LABEL' label."
            else
              IFS=',' read -ra PREFIXES <<< "$BYPASS_BRANCHES_PREFIX"
              for p in "${PREFIXES[@]}"; do
                p_trimmed="$(echo "$p" | xargs)"
                if [ -n "$p_trimmed" ] && [ "${HEAD_REF#"$p_trimmed"}" != "$HEAD_REF" ]; then
                  IS_HOTFIX="true"
                  echo "Branch '$HEAD_REF' starts with '$p_trimmed'."
                  break
                fi
              done
            fi
          else
            echo "Hotfix bypass disabled (allow_hotfix_bypass=false); SonarQube will run."
          fi

          if [ "$IS_HOTFIX" = "true" ]; then
            echo "Hotfix flow: checking type '$ISSUE_TYPE' against allowed: $JIRA_HOTFIX_ISSUE_TYPE."
            MATCHED=0
            IFS=',' read -ra ALLOWED <<< "$JIRA_HOTFIX_ISSUE_TYPE"
            for t in "${ALLOWED[@]}"; do
              t_trimmed="$(echo "$t" | xargs)"
              if [ "${ISSUE_TYPE,,}" = "${t_trimmed,,}" ]; then
                MATCHED=1
                break
              fi
            done
            if [ "$MATCHED" = "1" ]; then
              echo "Issue type '$ISSUE_TYPE' allowed for bypass; the quality gate will not block."
              echo "bypass=true" >> "$GITHUB_OUTPUT"
            else
              echo "::error::Hotfix flow triggered (label or branch prefix) but Jira issue type is '$ISSUE_TYPE', not one of: $JIRA_HOTFIX_ISSUE_TYPE."
              exit 1
            fi
          fi

      - name: Download coverage artifact
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: coverage
          path: .

      - name: SonarQube Scan
        id: sonar
        run: |
          sonar-scanner \
            -Dsonar.dependencyCheck.securityHotspot=true \
            -Dsonar.dependencyCheck.summarize=true \
            -Dsonar.qualitygate.wait=${{ steps.jira.outputs.bypass == 'true' && 'false' || inputs.fail_on_quality_gate }} \
            -Dsonar.projectKey=$COMPANY-$APPLICATION_NAME \
            -Dsonar.projectName=$COMPANY-$APPLICATION_NAME \
            -Dsonar.plugins.downloadOnlyRequired=true \
            -Dsonar.token=${{ secrets.SONAR_FOUNDATION_TOKEN }} \
            -Dsonar.projectBaseDir=${{ github.workspace }} \
            -Dsonar.sources=. \
            -Dsonar.scm.provider=git \
            -Dsonar.sourceEncoding=UTF-8 \
            -Dsonar.go.coverage.reportPaths=coverage.out \
            ${{ github.event_name == 'pull_request' && format('-Dsonar.pullrequest.key={0} -Dsonar.pullrequest.branch={1} -Dsonar.pullrequest.base={2}', github.event.pull_request.number, github.head_ref, github.base_ref) || '' }} \
            -Dsonar.exclusions="chart/**,node_modules/**,dist/**,coverage/**${{ inputs.sonar_exclusions != '' && format(',{0}', inputs.sonar_exclusions) || '' }}"

      - name: Report new code issues
        if: ${{ !cancelled() && steps.sonar.outcome != 'skipped' }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_FOUNDATION_TOKEN }}
          PROJECT_KEY: ${{ github.repository_owner }}-${{ github.event.repository.name }}
          IS_PR: ${{ github.event_name == 'pull_request' }}
          PR_KEY: ${{ github.event.pull_request.number }}
          BYPASS: ${{ steps.jira.outputs.bypass }}
          GATE_BLOCK_QUALITIES: ${{ inputs.gate_block_qualities }}
          GATE_BLOCK_SEVERITIES: ${{ inputs.gate_block_severities }}
          GATE_MAX_MAINTAINABILITY: ${{ inputs.gate_max_maintainability }}
        shell: bash
        run: |
          set -euo pipefail

          HOST="${SONAR_HOST_URL%/}"

          REPORT="${GITHUB_WORKSPACE}/.scannerwork/report-task.txt"
          if [ ! -f "$REPORT" ]; then
            echo "::error::report-task.txt not found; cannot confirm the analysis finished."
            exit 1
          fi
          CE_TASK_ID=$(grep '^ceTaskId=' "$REPORT" | cut -d= -f2-)
          CE_READY=0
          for _ in $(seq 1 30); do
            CE_STATUS=$(curl -sS -u "$SONAR_TOKEN:" "$HOST/api/ce/task?id=$CE_TASK_ID" | jq -r '.task.status // "UNKNOWN"')
            echo "Compute Engine task status: $CE_STATUS"
            case "$CE_STATUS" in
              SUCCESS) CE_READY=1; break ;;
              FAILED|CANCELED) echo "::error::Sonar analysis task $CE_STATUS."; exit 1 ;;
              *) sleep 5 ;;
            esac
          done
          if [ "$CE_READY" != "1" ]; then
            echo "::error::Timed out waiting for the Sonar analysis to finish."
            exit 1
          fi

          if [ "$IS_PR" = "true" ]; then
            SCOPE="pullRequest=$PR_KEY"
          else
            SCOPE="inNewCodePeriod=true"
          fi

          RESPONSE=$(curl -sS -u "$SONAR_TOKEN:" \
            "$HOST/api/issues/search?componentKeys=$PROJECT_KEY&$SCOPE&statuses=OPEN,CONFIRMED&ps=500")

          if ! echo "$RESPONSE" | jq -e 'has("issues")' >/dev/null 2>&1; then
            echo "::error::Unexpected response from the Sonar issues API:"
            echo "$RESPONSE"
            exit 1
          fi

          TOTAL=$(echo "$RESPONSE" | jq '.total')
          if [ "$TOTAL" -gt 500 ]; then
            echo "::warning::$TOTAL new-code issues found; only the first 500 were evaluated."
          fi

          ISSUES=$(echo "$RESPONSE" | jq '
            def category($tags; $imps):
              if   ($tags | index("duplicate"))      then "DUPLICATION"
              elif ($tags | index("brain-overload")) then "COMPLEXITY"
              elif ($tags | index("dead-store"))     then "DEAD_CODE"
              else ($imps[0].softwareQuality // "OTHER") end;
            [ .issues[] | . as $i | (($i.impacts // [])) as $imps | (($i.tags // [])) as $tags | {
                category: category($tags; $imps),
                quality:  ($imps[0].softwareQuality // "?"),
                severity: ($imps[0].severity // "?"),
                rule:     $i.rule,
                file:     ($i.component | sub("^[^:]+:"; "")),
                line:     ($i.line // 0),
                message:  $i.message,
                tags:     $tags
              } ]')

          echo "New code issues: $TOTAL"
          echo "$ISSUES" | jq .

          echo "$ISSUES" | jq -r '.[]
            | "- \(.category) | \(.quality)/\(.severity) | \(.rule) | \(.file):\(.line) — \(.message)"'

          {
            echo "## SonarQube — New code issues ($TOTAL)"
            echo ""
            if [ "$TOTAL" -eq 0 ]; then
              echo "No issues found in the new code."
            else
              echo "| Category | Quality | Severity | Rule | Location | Message |"
              echo "|---|---|---|---|---|---|"
              echo "$ISSUES" | jq -r '.[] | "| \(.category) | \(.quality) | \(.severity) | \(.rule) | \(.file):\(.line) | \(.message | gsub("\\|"; "\\|")) |"'
              echo ""
              echo "### By category"
              echo "$ISSUES" | jq -r 'group_by(.category)[] | "- **\(.[0].category)**: \(length)"'
              echo ""
              echo "### By severity"
              echo "$ISSUES" | jq -r 'group_by(.severity)[] | "- **\(.[0].severity)**: \(length)"'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          Q_JSON=$(printf '%s' "$GATE_BLOCK_QUALITIES" | jq -R 'split(",") | map(gsub("^\\s+|\\s+$";"") | ascii_upcase) | map(select(length > 0))')
          S_JSON=$(printf '%s' "$GATE_BLOCK_SEVERITIES" | jq -R 'split(",") | map(gsub("^\\s+|\\s+$";"") | ascii_upcase) | map(select(length > 0))')

          RISK=$(echo "$RESPONSE" | jq --argjson q "$Q_JSON" --argjson s "$S_JSON" '
            [ .issues[] | select(any(.impacts[]?; . as $imp | ($q | index($imp.softwareQuality)) and ($s | index($imp.severity)))) ] | length')
          MAINT=$(echo "$RESPONSE" | jq '
            [ .issues[] | select(any(.impacts[]?; .softwareQuality == "MAINTAINABILITY")) ] | length')

          echo "Gate — risk issues ($GATE_BLOCK_QUALITIES @ $GATE_BLOCK_SEVERITIES): $RISK"
          echo "Gate — maintainability issues: $MAINT (budget: $GATE_MAX_MAINTAINABILITY)"

          FAIL=0
          if [ "$TOTAL" -gt 500 ]; then
            echo "::error::$TOTAL new-code issues exceed the 500 evaluated; failing closed (cannot guarantee full coverage)."
            FAIL=1
          fi
          if [ "$RISK" -gt 0 ]; then
            echo "::error::$RISK new risk issue(s) ($GATE_BLOCK_QUALITIES at $GATE_BLOCK_SEVERITIES) — not allowed."
            FAIL=1
          fi
          if [ "$GATE_MAX_MAINTAINABILITY" -ge 0 ] && [ "$MAINT" -gt "$GATE_MAX_MAINTAINABILITY" ]; then
            echo "::error::$MAINT maintainability issue(s) exceed the budget of $GATE_MAX_MAINTAINABILITY."
            FAIL=1
          fi

          if [ "$FAIL" = "1" ]; then
            if [ "$BYPASS" = "true" ]; then
              echo "::warning::New-code gate would block, but the hotfix bypass is active — not failing."
            else
              echo "::error::New-code gate failed."
              exit 1
            fi
          else
            echo "New-code gate passed."
          fi
